# Runs both backend and frontend together with one command:
#   docker compose up
#
# Backend:  http://localhost:8000
# Frontend: http://localhost:5173

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app   # live-reload friendly for local dev

  frontend:
    image: python:3.13-slim
    working_dir: /frontend
    volumes:
      - ./frontend:/frontend
    ports:
      - "5173:5173"
    command: python -m http.server 5173
    depends_on:
      - backend
